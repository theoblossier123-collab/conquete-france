<html lang="fr"><head><meta charset="utf-8">

<style>
:root{--bg:#0a1020;--panel:#141c33;--tx:#f4f1e8;--mut:#8d98b8;--gold:#ffc83d;--red:#ff4d5e}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 0,#1b2850,var(--bg));color:var(--tx);font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 0}
h1{margin:0;font:900 clamp(18px,4.6vw,30px)/1 Impact,"Arial Black",sans-serif;letter-spacing:.5px}
.tm{font:900 clamp(20px,5vw,32px) Impact,sans-serif;color:var(--gold);background:var(--panel);padding:4px 12px;border-radius:10px;font-variant-numeric:tabular-nums}
.how{text-align:center;font-size:clamp(11px,2.9vw,16px);color:var(--mut);padding:2px 12px}
.how b{color:var(--gold)}
#map{flex:1;min-height:0;width:100%}
#map path{stroke:#0a1020;stroke-width:.7;stroke-linejoin:round}
#map text{font:800 8.5px Arial,sans-serif;fill:#fff;stroke:#000;stroke-width:2px;paint-order:stroke;text-anchor:middle;pointer-events:none}
.bot{padding:6px 12px 8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lb,.feed{background:var(--panel);border-radius:12px;padding:6px 10px;font-size:clamp(11px,2.8vw,15px);min-height:92px}
.lb div{display:flex;align-items:center;gap:6px;line-height:1.5}
.dot{width:12px;height:12px;border-radius:4px;flex:none}.lb .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lb b{color:var(--gold)}
.feed{display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.feed div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
#res{position:fixed;inset:0;background:rgba(5,8,18,.94);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;overflow:auto;z-index:5}
#res h2{font:900 clamp(26px,7vw,44px) Impact,sans-serif;margin:0 0 4px;color:var(--gold)}
.cols{display:grid;gap:10px;width:100%;max-width:440px;margin-top:10px;text-align:left}
.cols section{background:var(--panel);border-radius:12px;padding:8px 12px}
.cols h3{margin:0 0 4px;font-size:15px}.cols p{margin:2px 0;display:flex;gap:6px;font-size:15px}.cols p span{flex:1}
#tools{position:fixed;right:6px;bottom:6px;width:250px;background:#000c;border-radius:12px;padding:8px;font-size:12px;z-index:9}
#tools button,#tools select,#tools input{font:inherit;margin:2px 2px 0 0;padding:5px 7px;border-radius:8px;border:1px solid #444;background:#222;color:#fff}
#tools button{background:var(--red);border:0;font-weight:700}
</style></head><body>

D.forEach((d,i)=>{const t=document.createElementNS(NS,"text");t.setAttribute("x",d.x);t.setAttribute("y",d.y+3);t.textContent=d.c;svg.appendChild(t);T.push(t)});
const NM=D.map((d,i)=>[" "+norm(d.n)+" ",i]).sort((a,b)=>b[0].length-a[0].length),CODE={};D.forEach((d,i)=>CODE[d.c.toLowerCase()]=i);
function parse(s){const n=" "+norm(s)+" ";for(const[k,i]of NM)if(n.includes(k))return i;
 for(let t of n.trim().split(" ")){if(/^\d{1,3}$/.test(t)&&t.length==1)t="0"+t;if(t in CODE)return CODE[t]}return null}
let own,cnt,pend,U,left,over,tick;
function reset(){own=D.map((_,i)=>i);cnt=D.map(()=>1);pend=D.map(()=>0);U={};left=ROUND;over=false;
 D.forEach((_,i)=>{P[i].setAttribute("fill",col(i));T[i].textContent=D[i].c});$("res").style.display="none";lb()}
const log=t=>{const f=$("feed"),d=document.createElement("div");d.textContent=t;f.appendChild(d);while(f.children.length>5)f.firstChild.remove()};
function lb(){const o=[...D.keys()].sort((a,b)=>cnt[b]-cnt[a]).slice(0,5);
 $("lb").innerHTML=o.map((i,r)=>`<div><span class="dot" style="background:${col(i)}"></span><span class="n">${r+1}. ${D[i].c} ${D[i].n}</span><b>${cnt[i]}</b></div>`).join("")}
const blink=t=>{for(let i=0;i<N;i++)if(own[i]===t)P[i].animate([{filter:"brightness(1)"},{filter:"brightness(2.2)"},{filter:"brightness(1)"}],{duration:550})};
function cost(j){return 8+2*cnt[own[j]]}
function grab(t){let n=0;while(n++<40){let best=-1;
  const ok=j=>own[j]!==t&&(best<0||cost(j)<cost(best));
  if(cnt[t]==0){for(let j=0;j<N;j++)if(ok(j))best=j}else for(let i=0;i<N;i++)if(own[i]===t)for(const j of ADJ[i])if(ok(j))best=j;
  if(best<0||pend[t]<cost(best))return;
  pend[t]-=cost(best);const o=own[best];cnt[o]--;cnt[t]++;own[best]=t;
  P[best].setAttribute("fill",col(t));T[best].textContent=D[t].c;
  P[best].animate([{filter:"brightness(3)",opacity:.3},{filter:"brightness(1)",opacity:1}],{duration:800});
  log(`💥 ${D[t].c} ${D[t].n} prend ${D[best].n}`+(cnt[o]==0?` (${D[o].c} éliminé !)`:""));lb()}}
function power(t,p,u){U[u].pts+=p;pend[t]+=p;grab(t)}
const usr=u=>U[u]||(U[u]={t:null,pts:0,coins:0});
function ev(e){if(e.event==="status"){log("ℹ️ "+e.msg);$("st").textContent=e.msg;return}if(over)return;const u=e.nickname||"viewer",x=usr(u);
 if(e.event==="chat"){const t=parse(e.comment||"");if(t===null)return;x.t=t;blink(t);log(`💬 ${u} → ${D[t].c} ${D[t].n}`);power(t,2,u)}
 else{let t=x.t;if(e.event==="like"){if(t===null)return;blink(t);power(t,.3*(e.likeCount||1),u);return}
  if(t===null){t=Math.random()*N|0;x.t=t}
  if(e.event==="gift"){const c=e.coins||1;x.coins+=c;blink(t);log(`🎁 ${u} offre ${e.giftName||"un cadeau"} à ${D[t].c} ${D[t].n}`);power(t,c*6,u)}
  if(e.event==="share"){blink(t);log(`↗️ ${u} partage pour ${D[t].c}`);power(t,25,u)}}}
function top(k,n){return Object.entries(U).filter(e=>e[1][k]>0).sort((a,b)=>b[1][k]-a[1][k]).slice(0,n)}
function end(){over=true;const o=[...D.keys()].sort((a,b)=>cnt[b]-cnt[a]).slice(0,5),w=o[0];
 $("win").innerHTML=`<div style="font-size:20px">Le ${D[w].c} <b>${D[w].n}</b> règne sur ${cnt[w]} départements !</div>`;
 const blk=(h,r)=>`<section><h3>${h}</h3>${r.length?r.join(""):"<p>—</p>"}</section>`;
 $("cols").innerHTML=blk("🏆 Départements",o.map((i,r)=>`<p><span>${r+1}. ${D[i].c} ${D[i].n}</span><b>${cnt[i]}</b></p>`))
  +blk("💎 Top donateurs",top("coins",5).map((e,r)=>`<p><span>${r+1}. ${e[0]}</span><b>${e[1].coins} 🪙</b></p>`))
  +blk("🔥 Top supporters",top("pts",5).map((e,r)=>`<p><span>${r+1}. ${e[0]}</span><b>${Math.round(e[1].pts)}</b></p>`));
 $("res").style.display="flex";let s=20;const iv=setInterval(()=>{$("nx").textContent=`Nouvelle manche dans ${s--}s…`;if(s<0){clearInterval(iv);reset()}},1000)}
setInterval(()=>{if(over)return;left--;if(left<=0)return end();$("tm").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0")},1000);
// test
D.forEach((d,i)=>$("td").add(new Option(d.c+" "+d.n,i)));
let sim=null;const nm=["Lina","Yass","Mehdi","Sofia","Ali","Jade","Karim","Noa","Tom","Amina","Zoé","Hugo"];
$("tc").onclick=()=>ev({event:"chat",nickname:$("tu").value,comment:D[$("td").value].c});
$("tg").onclick=()=>ev({event:"gift",nickname:$("tu").value,coins:30,giftName:"un lion 🦁"});
$("tl").onclick=()=>ev({event:"like",nickname:$("tu").value,likeCount:20});
$("tp").onclick=()=>ev({event:"share",nickname:$("tu").value});
$("be").onclick=()=>{if(!over)end()};$("br").onclick=reset;
$("bs").onclick=()=>{if(sim){clearInterval(sim);sim=null;return}
 sim=setInterval(()=>{const u=nm[Math.random()*nm.length|0]+(Math.random()*30|0),r=Math.random(),d=D[Math.random()<.4?[75,13,69,59,33,31,67,6].map(x=>String(x).padStart(2,"0")).map(c=>CODE[c])[Math.random()*8|0]:Math.random()*N|0];
  if(r<.5)ev({event:"chat",nickname:u,comment:d.c});else if(r<.85)ev({event:"like",nickname:u,likeCount:10});else if(r<.95)ev({event:"share",nickname:u});else ev({event:"gift",nickname:u,coins:[1,5,30][Math.random()*3|0],giftName:"un cadeau"})},250)};
// connexion TikTok via server.js
function conn(){if(!location.protocol.startsWith("http"))return;
 const w=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/?user="+encodeURIComponent(q.get("user")||""));
 w.onopen=()=>$("st").textContent="🟢 serveur";w.onmessage=m=>{try{ev(JSON.parse(m.data))}catch(e){}};w.onclose=()=>{$("st").textContent="🔴";setTimeout(conn,3000)}}
reset();conn();
</script></body></html>
