.tm.hot{background:#e0243b;color:#fff;animation:pul .5s infinite alternate}@keyframes pul{to{transform:scale(1.13)}}

.bot{padding:6px 12px 8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lb,.feed{background:var(--panel);border-radius:12px;padding:6px 10px;font-size:clamp(11px,2.8vw,15px);min-height:92px}
.lb div{display:flex;align-items:center;gap:6px;line-height:1.5}

.feed div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
#res{position:fixed;inset:0;background:rgba(5,8,18,.94);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;overflow:auto;z-index:5}
#res h2{font:900 clamp(26px,7vw,44px) Impact,sans-serif;margin:0 0 4px;color:var(--gold)}
.cols{display:grid;gap:10px;width:100%;max-width:440px;margin-top:10px;text-align:left}
.cols section{background:var(--panel);border-radius:12px;padding:8px 12px}
.cols h3{margin:0 0 4px;font-size:15px}.cols p{margin:2px 0;display:flex;gap:6px;font-size:15px}.cols p span{flex:1}

function take(t,i){const o=owner[i];owner[i]=t;cnt[o]--;cnt[t]++;const x=i%GW,y=(i/GW)|0;sx[o]-=x;sy[o]-=y;sx[t]+=x;sy[t]+=y;edge[t].push(i);

function grow(t){if(cnt[t]===0){for(let k=0;k<300;k++){const i=(Math.random()*owner.length)|0;if(owner[i]<255&&owner[i]!==t){take(t,i);return true}}return false}

function tone(f,t0,d,ty,v,f2){const a=ac();if(!a)return;if(a.state!=="running"){$("snd").style.display="block";return}
 const o=a.createOscillator(),g=a.createGain(),n=a.currentTime+t0;o.type=ty||"sine";o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);
 g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(Math.max(.0002,(v||.2)*vol),n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+d);
 o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+d+.05)}
